<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>机制示例：固定舞台三维拆解</title>
<!--
机制：ScrollTrigger 固定（pin）一屏舞台，scrub 驱动一个 three 物体经历三段状态：旋转、分解、相机推进。HTML 文字叠层按段切换。
来自技术卡：T16（research/R4-visual-tech.md）。
适合 / 不适合：适合产品拆解、结构讲解，3 段以内。不适合长文阅读或多于 2 屏的固定。
依赖与固定版本：gsap 与 ScrollTrigger 3.15.0，three 0.186.0，均经 jsDelivr。
Reduce Motion 退路：不创建 ScrollTrigger，不 pin。显示 3 个按钮，点击后渲染该段终态一帧，文字同步切换。gsap 加载失败时走同一退路。
@supports 或能力退路：WebGL 不可用时画布隐藏，只显示三段文字清单。
已知限制：pin 总长 2 屏（1 屏舞台加 1 屏滚动距离），写在 data-pin-screens。软件渲染下 scrub 帧率低。
不可照抄的部分：几何体、颜色、文案。只抄 state(p) 的三段映射、ScrollTrigger.create 的参数与 RM 分支。
接入方法：
1. 复制 .stage、.note、build()、state() 与 ScrollTrigger.create 块。
2. 用自己的模型替换 build() 里的 8 个方块。
3. 保持 data-pin-screens 不大于 2，并让 end 与它一致。
性能预算：8 个网格，1 次渲染每个 scrub 更新。DPR 上限 1.5。
-->
<style>
:root{--bg:#d9d9d9;--fg:#161616;--mute:#3c3c3c;--card:#f4f4f4}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b1b;--fg:#eee;--mute:#c0c0c0;--card:#262626}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.7 system-ui,-apple-system,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}
.intro,footer{max-width:40rem;margin:0 auto;padding:12vh 16px}
h1{font-size:2rem;line-height:1.25;margin:0 0 1rem}p{color:var(--mute);margin:0}
.stage{position:relative;height:100vh;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.note{position:absolute;left:16px;bottom:8vh;max-width:24rem;background:var(--card);padding:1rem 1.25rem;opacity:0}
.note.on{opacity:1}.note h2{margin:0 0 .25rem;font-size:1.25rem}
nav{display:none;position:absolute;top:12px;left:16px;gap:8px}
nav button{min-width:44px;min-height:44px;border:1px solid var(--fg);background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
nav button[aria-current=true]{background:var(--fg);color:var(--bg)}
nav button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.rm nav{display:flex}
</style>
</head>
<body>
<section class="intro"><h1>固定舞台三维拆解</h1><p>机制示例。向下滚动，画面固定 1 屏。物体依次旋转、分解、被相机推近。</p></section>
<section class="stage" id="stage" data-pin-screens="2">
 <canvas id="c" aria-label="三维物体：8 个方块组成的立方体，随滚动旋转、分解、被推近"></canvas>
 <nav id="nav" aria-label="状态导航"></nav>
 <div class="note"><h2>第一段：旋转</h2><p>8 个方块拼成一个整体，缓慢转动。</p></div>
 <div class="note"><h2>第二段：分解</h2><p>方块沿对角线向外飞开。</p></div>
 <div class="note"><h2>第三段：推进</h2><p>相机穿进分解后的空隙。</p></div>
</section>
<footer><p>页脚。pin 已释放，页面正常滚动。</p></footer>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const stage=document.getElementById('stage'),cv=document.getElementById('c'),nav=document.getElementById('nav'),notes=[...document.querySelectorAll('.note')];
const rm=matchMedia('(prefers-reduced-motion: reduce)');
let r;try{r=new THREE.WebGLRenderer({canvas:cv,antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,1.5))}catch(e){cv.hidden=true;notes.forEach(n=>n.classList.add('on'));notes.forEach((n,i)=>n.style.cssText='position:static;margin:1rem 16px;opacity:1');stage.style.height='auto'}
if(r){
 const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,.1,80);sc.background=new THREE.Color(0xc8c8c8);
 sc.add(new THREE.HemisphereLight(0xffffff,0x555555,2.4));const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(4,8,6);sc.add(dl);
 const g=new THREE.Group();sc.add(g);const cubes=[];
 for(let i=0;i<8;i++){const d=new THREE.Vector3(i&1?1:-1,i&2?1:-1,i&4?1:-1);
  const m=new THREE.Mesh(new THREE.BoxGeometry(.95,.95,.95),new THREE.MeshStandardMaterial({color:i%3?0x8a8a8a:0x2f4bd8,roughness:.55}));
  m.userData.d=d;g.add(m);cubes.push(m)}
 function size(){const w=cv.clientWidth,h=cv.clientHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
 const ease=t=>t*t*(3-2*t),seg=(p,a,b)=>Math.min(1,Math.max(0,(p-a)/(b-a)));
 function state(p){ // p 0..1：0 到 .34 旋转，.34 到 .67 分解，.67 到 1 推进
  const a=ease(seg(p,0,.34)),b=ease(seg(p,.34,.67)),c=ease(seg(p,.67,1));
  g.rotation.set(.4+a*.9,a*Math.PI*1.5+b*.3,0);
  cubes.forEach(m=>m.position.copy(m.userData.d).multiplyScalar(.5+b*1.6));
  cam.position.set(0,0,9-c*6.2);cam.lookAt(0,0,0);
  const i=p<.34?0:p<.67?1:2;notes.forEach((n,k)=>n.classList.toggle('on',k===i));
  r.render(sc,cam);return i}
 function setup(){size();
  if(rm.matches||!window.gsap||!window.ScrollTrigger){ // 退路：无 pin，无 scrub，按钮切换终态
   stage.classList.add('rm');if(nav.children.length==0)[.15,.5,1].forEach((p,i)=>{const b=document.createElement('button');b.textContent=i+1;b.setAttribute('aria-label','第 '+(i+1)+' 段');
    b.onclick=()=>{const k=state(p);[...nav.children].forEach((x,j)=>x.setAttribute('aria-current',j===k))};nav.append(b)});
   nav.children[0].click();return}
  gsap.registerPlugin(ScrollTrigger);
  ScrollTrigger.create({trigger:stage,start:'top top',end:'+=100%',pin:true,scrub:.5,onUpdate:s=>state(s.progress)}); // 总长 2 屏
  state(0)}
 addEventListener('resize',()=>{size();state(window.ScrollTrigger&&!rm.matches?(ScrollTrigger.getAll()[0]?.progress||0):.15)});
 rm.addEventListener('change',()=>location.reload());setup();
}
</script>
</body>
</html>
