<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>机制示例：指针流体墨迹</title>
<!--
机制：原生 WebGL2。染料纹理双缓冲（ping-pong FBO）。每帧按 curl noise 速度场加指针速度回溯采样（semi-Lagrangian advection），指针处注入染料，整体衰减。
来自技术卡：T09（research/R4-visual-tech.md）。这是简化版：没有压力求解与散度投影，速度场用 curl noise 近似。
适合 / 不适合：适合封面背景、指针互动的氛围层。不适合需要物理正确的流体。
依赖与固定版本：无。
对比度：文字放在实色面板（.panel）上，面板色与文字色比值约 17:1，不压在流体上。
Reduce Motion 退路：预置几处染料，推进若干步后画一帧，然后停止。不监听指针。CSS 与 JS 都检查。
性能预算：染料纹理 512x512 RGBA8，每帧 2 个全屏 pass。2 核软件渲染可运行但慢。
已知限制：RGBA8 染料在低值处有量化残影。没有 WebGL2 时显示实色背景。
不可照抄的部分：颜色、文案、版式。只抄 advect 着色器与 ping-pong 结构。
接入方法：
1. 复制 canvas、两个着色器与 step() 函数。
2. 把染料色与背景色改成方向单的令牌。
3. 保持文字在实色面板上。
-->
<style>
:root{--bg:#d4d4d4;--panel:#f6f6f6;--fg:#141414;--mute:#454545}
@media (prefers-color-scheme:dark){:root{--bg:#222;--panel:#101010;--fg:#f2f2f2;--mute:#b8b8b8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.7 system-ui,-apple-system,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.panel{position:relative;max-width:30rem;margin:18vh 0 0 6vw;background:var(--panel);padding:1.5rem;pointer-events:none}
h1{font-size:2rem;line-height:1.25;margin:0 0 .75rem}p{margin:0;color:var(--mute)}
@media (prefers-reduced-motion:reduce){canvas{touch-action:auto}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="panel"><h1>指针流体墨迹</h1><p>机制示例。移动指针，在背景里拖出墨迹，墨迹随噪声速度场缓慢卷曲并衰减。文字在实色面板上，不受流体影响。</p></div>
<script>
(()=>{
const cv=document.getElementById('c'),rm=matchMedia('(prefers-reduced-motion: reduce)');
const gl=cv.getContext('webgl2',{antialias:false});
if(!gl){document.body.style.background='var(--bg)';return}
const N=512,V=`#version 300 es
in vec2 p;out vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0,1);}`;
const ADV=`#version 300 es
precision highp float;in vec2 uv;out vec4 o;uniform sampler2D d;uniform vec2 m,mv;uniform float t,on,asp;
vec2 h(vec2 i){i=vec2(dot(i,vec2(127.1,311.7)),dot(i,vec2(269.5,183.3)));return fract(sin(i)*43758.5453)*2.-1.;}
float n(vec2 x){vec2 i=floor(x),f=fract(x),u=f*f*(3.-2.*f);return mix(mix(dot(h(i),f),dot(h(i+vec2(1,0)),f-vec2(1,0)),u.x),mix(dot(h(i+vec2(0,1)),f-vec2(0,1)),dot(h(i+vec2(1,1)),f-vec2(1,1)),u.x),u.y);}
void main(){
 vec2 q=uv*vec2(asp,1.)*3.+t*.05,e=vec2(.01,0);
 vec2 c=vec2(n(q+e.yx)-n(q-e.yx),-(n(q+e)-n(q-e)))/(2.*e.x);
 vec2 vel=c*.0012+mv*.9*exp(-dot((uv-m)*vec2(asp,1.),(uv-m)*vec2(asp,1.))*60.);
 float k=texture(d,uv-vel).r*.992;
 vec2 dm=(uv-m)*vec2(asp,1.);k+=on*exp(-dot(dm,dm)*900.)*.5;
 o=vec4(vec3(min(k,1.)),1);}`;
const SHOW=`#version 300 es
precision highp float;in vec2 uv;out vec4 o;uniform sampler2D d;uniform vec3 bg,ink;
void main(){float k=smoothstep(.02,.9,texture(d,uv).r);o=vec4(mix(bg,ink,k),1);}`;
function prog(f){const mk=(t,s)=>{const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(x));return x};
 const p=gl.createProgram();gl.attachShader(p,mk(gl.VERTEX_SHADER,V));gl.attachShader(p,mk(gl.FRAGMENT_SHADER,f));gl.bindAttribLocation(p,0,'p');gl.linkProgram(p);return p}
const pa=prog(ADV),ps=prog(SHOW);
const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
function fbo(){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,N,N,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
 const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);return{t,f}}
let A=fbo(),B=fbo();
const css=v=>{const s=getComputedStyle(document.documentElement).getPropertyValue(v).trim();const c=document.createElement('canvas').getContext('2d');c.fillStyle=s;c.fillRect(0,0,1,1);const d=c.getImageData(0,0,1,1).data;return[d[0]/255,d[1]/255,d[2]/255]};
let m=[.5,.5],mv=[0,0],on=0,t=0,raf=0;
function step(pt,pmv,pon){
 gl.bindFramebuffer(gl.FRAMEBUFFER,B.f);gl.viewport(0,0,N,N);gl.useProgram(pa);
 gl.bindTexture(gl.TEXTURE_2D,A.t);const u=n=>gl.getUniformLocation(pa,n);
 gl.uniform2f(u('m'),pt[0],pt[1]);gl.uniform2f(u('mv'),pmv[0],pmv[1]);gl.uniform1f(u('t'),t);gl.uniform1f(u('on'),pon);gl.uniform1f(u('asp'),cv.width/cv.height);
 gl.drawArrays(gl.TRIANGLE_STRIP,0,4);[A,B]=[B,A];
}
function show(){
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,cv.width,cv.height);gl.useProgram(ps);gl.bindTexture(gl.TEXTURE_2D,A.t);
 gl.uniform3fv(gl.getUniformLocation(ps,'bg'),css('--bg'));gl.uniform3fv(gl.getUniformLocation(ps,'ink'),css('--fg'));gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
function size(){cv.width=Math.round(innerWidth*Math.min(devicePixelRatio,1.5));cv.height=Math.round(innerHeight*Math.min(devicePixelRatio,1.5))}
function loop(){t+=1/60;step(m,mv,on);mv=[mv[0]*.85,mv[1]*.85];on*=.8;show();raf=requestAnimationFrame(loop)}
function still(){ // 减少动态：预置染料，推进后画一帧
 cancelAnimationFrame(raf);raf=0;
 [[.7,.5],[.82,.35],[.62,.72]].forEach(p=>{for(let i=0;i<3;i++)step(p,[.002,-.001],1)});
 for(let i=0;i<30;i++){t+=1/60;step([2,2],[0,0],0)}show();
}
addEventListener('pointermove',e=>{if(rm.matches)return;const x=e.clientX/innerWidth,y=1-e.clientY/innerHeight;mv=[(x-m[0])*.4,(y-m[1])*.4];m=[x,y];on=1});
function setup(){size();if(rm.matches)still();else if(!raf)loop()}
addEventListener('resize',()=>{size();if(rm.matches)show()});rm.addEventListener('change',setup);setup();
})();
</script>
</body>
</html>
