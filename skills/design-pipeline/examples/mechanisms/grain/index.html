<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>机制示例：颗粒与胶片质感</title>
<!--
机制：SVG feTurbulence 生成静态颗粒层，叠在色场与正文上。可选用 steps() 切换 background-position 做轻微动态颗粒。
适合 / 不适合：适合给大色块、渐变、图片加纸感或胶片感，不适合小字密集的信息面板（颗粒会降低可读性）。
依赖与固定版本：无。纯 CSS 与 SVG。
来源与许可：自写，MIT。
Reduce Motion 退路：关闭动态颗粒，只留静态层。CSS 媒体查询与 JS matchMedia 都检查。
性能预算：静态层 0 帧开销。动态层每秒 8 次位移，只用 transform 无关的 background-position，整页约 4 KB 以内。
不可照抄的部分：配色、字体、版式、文案。只抄 .grain 层、steps() 动画和对比度计算。
接入方法：
1. 复制 .grain 与 @keyframes g 到你的样式表，把 SVG data URI 保持原样。
2. 在 body 末尾放 <div class="grain" aria-hidden="true"></div>。
3. 用 data-live 属性开关动态颗粒，用 --grain-op 调强度（建议 0.08 到 0.16）。
-->
<style>
:root{
  --bg:#d9dcd8; --fg:#1d2220; --accent:#2f6f73;
  --grain-op:.16; --grain-blend:multiply;
}
@media (prefers-color-scheme:dark){:root{--bg:#2a2f2e;--fg:#eceeed;--grain-blend:screen}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.7 system-ui,-apple-system,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif;min-height:100vh}
main{max-width:40rem;margin:0 auto;padding:12vh 16px 16vh}
h1{font-size:1.9rem;line-height:1.25;margin:0 0 1rem;border-left:6px solid var(--accent);padding-left:.75rem}
p{margin:0 0 1rem}
.field{height:34vh;margin:2rem 0;background:linear-gradient(135deg,var(--accent),var(--bg) 85%)}
code{background:rgba(127,127,127,.18);padding:0 .3em}
button{font:inherit;color:inherit;background:none;border:2px solid currentColor;padding:.4rem .9rem;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
/* 颗粒层：固定在最上层，不拦截指针 */
.grain{position:fixed;inset:-50%;pointer-events:none;z-index:9;opacity:var(--grain-op);mix-blend-mode:var(--grain-blend);
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.4 -.2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
:root[data-live="1"] .grain{animation:g .9s steps(8) infinite}
@keyframes g{0%{transform:translate(0,0)}12%{transform:translate(-5%,-8%)}25%{transform:translate(-12%,4%)}37%{transform:translate(6%,-14%)}50%{transform:translate(-4%,12%)}62%{transform:translate(12%,2%)}75%{transform:translate(-9%,9%)}87%{transform:translate(4%,-5%)}100%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){:root[data-live="1"] .grain{animation:none}}
</style>
</head>
<body>
<main>
<h1>颗粒与胶片质感</h1>
<p>这是机制示例，只演示技术，不带最终配色与版式。颗粒层由 SVG <code>feTurbulence</code> 生成，叠在色场与正文上。</p>
<div class="field" role="img" aria-label="带颗粒的渐变色场"></div>
<p>正文颜色与背景色的对比度由脚本实时计算，结果显示在下方。颗粒层强度不超过 0.16 时，正文仍应保持 4.5:1 以上。</p>
<p id="cr" aria-live="polite">计算中…</p>
<p><button id="live" type="button" aria-pressed="false">开启动态颗粒</button></p>
</main>
<div class="grain" aria-hidden="true"></div>
<script>
const root=document.documentElement,btn=document.getElementById('live'),out=document.getElementById('cr');
const rm=matchMedia('(prefers-reduced-motion: reduce)');
// 相对亮度与对比度（WCAG 2.x 公式）
const lum=c=>{const f=v=>(v/=255)<=.03928?v/12.92:((v+.055)/1.055)**2.4;return .2126*f(c[0])+.7152*f(c[1])+.0722*f(c[2])};
const rgb=s=>{const e=document.createElement('i');e.style.color=s;document.body.append(e);const m=getComputedStyle(e).color.match(/\d+/g).map(Number);e.remove();return m};
function report(){
  const s=getComputedStyle(root),fg=rgb(s.getPropertyValue('--fg')),bg=rgb(s.getPropertyValue('--bg'));
  const a=lum(fg),b=lum(bg),r=(Math.max(a,b)+.05)/(Math.min(a,b)+.05);
  // 最坏情况：颗粒以不透明度 op 把背景推向黑或白，估算背景偏移后的对比度
  const op=parseFloat(s.getPropertyValue('--grain-op')),tgt=a>b?255:0;
  const bg2=bg.map(v=>v*(1-op)+tgt*op),b2=lum(bg2),r2=(Math.max(a,b2)+.05)/(Math.min(a,b2)+.05);
  out.textContent='正文对比度 '+r.toFixed(2)+':1，颗粒最坏情况 '+r2.toFixed(2)+':1，'+(r2>=4.5?'通过 4.5:1':'未通过 4.5:1，降低 --grain-op');
}
function set(on){root.dataset.live=on&&!rm.matches?'1':'0';btn.setAttribute('aria-pressed',String(on));btn.textContent=on?'关闭动态颗粒':'开启动态颗粒'}
btn.onclick=()=>set(btn.getAttribute('aria-pressed')!=='true');
if(rm.matches){btn.disabled=true;btn.textContent='系统要求减少动态：只显示静态颗粒'}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',report);
report();
</script>
</body>
</html>
