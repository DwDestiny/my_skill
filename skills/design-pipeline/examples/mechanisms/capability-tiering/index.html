<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>机制示例：能力分级</title>
<!--
机制：探测 navigator.gpu、WebGL2、deviceMemory、hardwareConcurrency、prefers-reduced-motion、prefers-reduced-transparency，判成 full / lite / static 三档。结果写入 window.__tier，页面上显示判定表，并用同一个舞台演示三档的不同实现。
来自技术卡：T28 到 T30（research/R4-visual-tech.md）。
判定规则：
1. 减少动态，或没有 WebGL2：static。
2. 内存不足 4 GB（未知时按 4 GB），或核数不足 4，或没有 navigator.gpu 且核数不足 8：lite。
3. 其余：full。
4. 少透明另设 solid=true，玻璃与半透明改实色。
5. 测试用 URL 参数 ?tier=full|lite|static 覆盖判定。
window.__tier 的形状：{tier, solid, signals:{gpu, webgl2, mem, cores, rm, rt}}。其他示例读取它来选择实现。
舞台三档实现：full 用 WebGL2 片元着色器动画。lite 用 CSS 渐变动画。static 用一张静态渐变。
Reduce Motion 退路：直接判成 static。CSS 与 JS 都检查。
已知限制：deviceMemory 只有 Chromium 提供，且上限 8。navigator.gpu 存在不代表有独显。阈值要用真机校准。
不可照抄的部分：颜色、版式。只抄 detect() 与 window.__tier 的约定。
接入方法：
1. 复制 detect() 与 <script> 前半段，放在页面最前。
2. 其他代码读 window.__tier.tier，按档位选实现。
3. 保持 static 档为无动画的完整页面。
-->
<style>
:root{--bg:#dcdcdc;--fg:#161616;--mute:#444;--card:#f2f2f2;--a:#9a9a9a;--b:#6b6b6b}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1c;--fg:#eee;--mute:#b5b5b5;--card:#2a2a2a;--a:#555;--b:#8a8a8a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.7 system-ui,-apple-system,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}
main{max-width:44rem;margin:0 auto;padding:8vh 16px}
h1{font-size:2rem;line-height:1.25;margin:0 0 1rem}p{color:var(--mute)}
.stage{position:relative;height:240px;margin:1.5rem 0;overflow:hidden;background:linear-gradient(135deg,var(--a),var(--b))}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.stage[data-t=lite]{background:linear-gradient(135deg,var(--a),var(--b),var(--a));background-size:300% 300%;animation:drift 8s ease-in-out infinite alternate}
.stage[data-t=static]{animation:none}
@keyframes drift{to{background-position:100% 100%}}
.badge{position:absolute;left:12px;bottom:12px;background:var(--card);padding:.25rem .75rem;font-weight:600}
table{border-collapse:collapse;width:100%;background:var(--card)}
th,td{text-align:left;padding:.5rem .75rem;border-bottom:1px solid var(--a)}td:last-child{font-variant-numeric:tabular-nums}
.badge[data-solid=false]{backdrop-filter:blur(6px);background:color-mix(in srgb,var(--card) 80%,transparent)}
@media (prefers-reduced-motion:reduce){.stage[data-t]{animation:none}}
</style>
</head>
<body>
<main>
<h1>能力分级</h1>
<p>机制示例。页面探测设备信号，判成 full、lite、static 三档。下面的舞台随档位换实现。加 <code>?tier=lite</code> 之类的参数可强制测试。</p>
<div class="stage" id="stage"><canvas id="cv" hidden></canvas><span class="badge" id="badge" data-solid="true"></span></div>
<table><thead><tr><th>信号</th><th>读数</th></tr></thead><tbody id="rows"></tbody></table>
</main>
<script>
// ---- 探测。复制这一段到页面最前 ----
function detect(){
 const mq=q=>matchMedia(q).matches;
 const c=document.createElement('canvas'),webgl2=!!(c.getContext&&c.getContext('webgl2'));
 const s={gpu:!!navigator.gpu,webgl2,mem:navigator.deviceMemory||null,cores:navigator.hardwareConcurrency||null,
  rm:mq('(prefers-reduced-motion: reduce)'),rt:mq('(prefers-reduced-transparency: reduce)')};
 let tier;
 if(s.rm||!s.webgl2)tier='static';
 else if((s.mem||4)<4||(s.cores||2)<4||(!s.gpu&&(s.cores||2)<8))tier='lite';
 else tier='full';
 const o=new URLSearchParams(location.search).get('tier');
 if(['full','lite','static'].includes(o))tier=o;
 return{tier,solid:s.rt,signals:s};
}
window.__tier=detect();
// ---- 演示舞台 ----
(()=>{
 const T=window.__tier,st=document.getElementById('stage'),cv=document.getElementById('cv'),b=document.getElementById('badge');
 st.dataset.t=T.tier;b.dataset.solid=T.solid;b.textContent='当前档位：'+T.tier+(T.solid?'（实色）':'');
 const rows=document.getElementById('rows');
 Object.entries(T.signals).concat([['tier',T.tier],['solid',T.solid]]).forEach(([k,v])=>{const r=rows.insertRow();r.insertCell().textContent=k;r.insertCell().textContent=v===null?'未知':String(v)});
 if(T.tier!=='full')return;
 const gl=cv.getContext('webgl2');if(!gl){st.dataset.t='lite';return}
 cv.hidden=false;
 const mk=(t,s)=>{const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(x));return x};
 const p=gl.createProgram();
 gl.attachShader(p,mk(gl.VERTEX_SHADER,'#version 300 es\nin vec2 a;void main(){gl_Position=vec4(a,0,1);}'));
 gl.attachShader(p,mk(gl.FRAGMENT_SHADER,'#version 300 es\nprecision mediump float;uniform vec2 r;uniform float t;out vec4 o;void main(){vec2 u=gl_FragCoord.xy/r;float v=.5+.25*sin(u.x*8.+t)+.25*sin(u.y*6.-t*1.3+u.x*4.);o=vec4(vec3(.35+.4*v),1);}'));
 gl.bindAttribLocation(p,0,'a');gl.linkProgram(p);gl.useProgram(p);
 gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
 const rm=matchMedia('(prefers-reduced-motion: reduce)');
 function draw(ms){cv.width=cv.clientWidth;cv.height=cv.clientHeight;gl.viewport(0,0,cv.width,cv.height);
  gl.uniform2f(gl.getUniformLocation(p,'r'),cv.width,cv.height);gl.uniform1f(gl.getUniformLocation(p,'t'),ms/1000);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  if(!rm.matches)requestAnimationFrame(draw)}
 requestAnimationFrame(draw);
})();
</script>
</body>
</html>
