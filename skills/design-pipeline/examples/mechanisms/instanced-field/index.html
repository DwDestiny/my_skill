<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>机制示例：实例化点阵</title>
<!--
机制：InstancedMesh 画 60x50=3000 根方柱。每根柱的高度来自噪声场（正弦叠加）。鼠标位置移动波心，滚动推进相位。静止后停止 rAF。
来自技术卡：T03（research/R4-visual-tech.md）。
适合 / 不适合：适合背景场、数据地形感、粒子墙。不适合需要逐个交互或读标签的元素。
依赖与固定版本：three 0.186.0，经 jsDelivr 加载（importmap）。WebGL 1 或 2 均可。
Reduce Motion 退路：只渲染一帧静态排列，不绑鼠标与滚动。CSS 与 JS 都检查。
@supports 或能力退路：WebGL 不可用时显示内联静态 SVG（同样的柱阵剪影），画布移除。
已知限制：3000 实例每帧重写矩阵，软件渲染约 5 帧每秒。目标态在 600 ms 内衰减到静止后停止循环。
不可照抄的部分：颜色与版式。只抄 InstancedMesh 建法、field() 与按需渲染的 kick() 约定。
接入方法：
1. 复制 field()、build()、kick() 与 SVG 退路。
2. 改 NX、NZ 控制实例数，保持在 2000 到 5000。
3. 保持渲染按需，不要常驻 rAF。
性能预算：3000 实例，1 个材质，1 次绘制调用。DPR 上限 1。
-->
<style>
:root{--bg:#d9d9d9;--fg:#161616;--mute:#3c3c3c;--card:#f4f4f4;--acc:#2f4bd8}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b1b;--fg:#eee;--mute:#c0c0c0;--card:#262626;--acc:#8fa2ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.7 system-ui,-apple-system,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}
header{max-width:40rem;margin:0 auto;padding:10vh 16px 3vh}
h1{font-size:2rem;line-height:1.25;margin:0 0 1rem}p{color:var(--mute);margin:0}
.stage{position:relative;height:60vh;min-height:320px}
.stage canvas,.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.spacer{height:80vh}
footer{max-width:40rem;margin:0 auto;padding:4vh 16px 10vh}
</style>
</head>
<body>
<header><h1>实例化点阵</h1><p>机制示例。移动鼠标改变波心，滚动页面推进相位。3000 根柱子只用 1 次绘制调用。</p></header>
<div class="stage" id="stage" role="img" aria-label="三维柱阵，高度随噪声场起伏"></div>
<div class="spacer"></div>
<footer><p>页脚。滚动到这里，相位已推进。</p></footer>
<template id="fb"><svg viewBox="0 0 300 120" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" fill="currentColor" color="#8a8a8a"><path d="M0 120V80l12-6 12 10 12-16 12 12 12-20 12 14 12-10 12 8 12-22 12 12 12-8 12 14 12-18 12 10 12-12 12 18 12-14 12 8 12-16 12 12 12-6 12 10 12-12 12 8 12-4 12 6V120z"/></svg></template>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"}}</script>
<script type="module">
const st=document.getElementById('stage'),rm=matchMedia('(prefers-reduced-motion: reduce)');
const fallback=()=>{st.replaceChildren(document.getElementById('fb').content.cloneNode(true))};
let THREE;try{THREE=await import('three')}catch(e){fallback()}
if(THREE){
 let r;try{r=new THREE.WebGLRenderer({antialias:false})}catch(e){fallback()}
 if(r){
 r.setPixelRatio(1);st.append(r.domElement);
 const NX=60,NZ=50,N=NX*NZ,sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,.1,200);sc.background=new THREE.Color(0xc8c8c8);
 sc.add(new THREE.HemisphereLight(0xffffff,0x555555,2.4));const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(5,10,6);sc.add(dl);
 const im=new THREE.InstancedMesh(new THREE.BoxGeometry(.7,1,.7),new THREE.MeshStandardMaterial({color:0x8a8a8a,roughness:.6}),N);sc.add(im);
 const col=new THREE.Color(),acc=new THREE.Color(0x2f4bd8),base=new THREE.Color(0x8a8a8a),m=new THREE.Matrix4();
 const S={phase:0,cx:.5,cz:.5,tp:0,tx:.5,tz:.5};
 const field=(x,z)=>{const a=Math.sin(x*.35+S.phase)+Math.sin(z*.42-S.phase*.7)+.5*Math.sin((x+z)*.8+S.phase*1.3);return a};
 function build(){let i=0;for(let ix=0;ix<NX;ix++)for(let iz=0;iz<NZ;iz++){
  const x=(ix-NX/2)*.9,z=(iz-NZ/2)*.9,d=Math.hypot(ix/NX-S.cx,iz/NZ-S.cz),h=Math.max(.15,1.6+field(x,z)*.9+(1-Math.min(1,d*2.5))*2.2);
  m.makeScale(1,h,1);m.setPosition(x,h/2,z);im.setMatrixAt(i,m);im.setColorAt(i,col.copy(base).lerp(acc,Math.min(1,Math.max(0,(h-2)/3))));i++}
  im.instanceMatrix.needsUpdate=true;im.instanceColor.needsUpdate=true}
 function size(){const w=st.clientWidth,h=st.clientHeight;r.setSize(w,h,false);r.domElement.style.cssText='position:absolute;inset:0;width:100%;height:100%';cam.aspect=w/h;cam.position.set(0,26,w<600?58:40);cam.lookAt(0,0,0);cam.updateProjectionMatrix()}
 function draw(){build();r.render(sc,cam)}
 let raf=0;
 function kick(){if(rm.matches||raf)return;raf=requestAnimationFrame(function step(){ // 按需循环，差值收敛后停止
  const k=.18;S.phase+=(S.tp-S.phase)*k;S.cx+=(S.tx-S.cx)*k;S.cz+=(S.tz-S.cz)*k;draw();
  raf=(Math.abs(S.tp-S.phase)+Math.abs(S.tx-S.cx)+Math.abs(S.tz-S.cz)>.004)?requestAnimationFrame(step):0})}
 function setup(){size();if(rm.matches){S.phase=1.2;draw()}else{S.tp=scrollY/200;kick();draw()}}
 addEventListener('pointermove',e=>{const b=st.getBoundingClientRect();S.tx=(e.clientX-b.left)/b.width;S.tz=(e.clientY-b.top)/b.height;kick()},{passive:true});
 addEventListener('scroll',()=>{S.tp=scrollY/200;kick()},{passive:true});addEventListener('resize',setup);rm.addEventListener('change',setup);setup();
 }}
</script>
</body>
</html>
