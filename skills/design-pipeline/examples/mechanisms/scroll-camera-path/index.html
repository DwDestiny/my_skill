<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>机制示例：滚动相机路径</title>
<!--
机制：three.js 场景里有 4 个站点。相机沿 CatmullRomCurve3 随滚动穿行，每站有一块 HTML 叠层文字。
来自技术卡：T13（research/R4-visual-tech.md）。
适合 / 不适合：适合 3 到 5 站的空间叙事。不适合需要精确阅读长文的页面。
依赖与固定版本：three 0.186.0，经 jsDelivr 加载（importmap）。不用 GSAP，用 position:sticky 加 scroll 事件。
Reduce Motion 退路：不绑滚动。页面显示站点导航，点击后渲染该站的一帧静态视图，文字同步切换。CSS 与 JS 都检查。
性能预算：pin 总高 3 屏（.track 为 400vh，含 1 屏可视高），之后是页脚。每帧只改相机与叠层 opacity。
已知限制：RM 模式用同一个画布切换 4 站，不是并排 4 张图。软件渲染下帧率低。
不可照抄的部分：几何体、颜色、文案。只抄曲线、站点参数 t 与 progress 映射。
接入方法：
1. 复制 .track、.sticky、站点数组 ST 与 frame() 函数。
2. 用自己的模型替换 build() 里的方块。
3. 保持 .track 高度不超过 400vh。
-->
<style>
:root{--bg:#d9d9d9;--fg:#161616;--mute:#444;--card:#f4f4f4}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b1b;--fg:#eee;--mute:#b5b5b5;--card:#262626}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.7 system-ui,-apple-system,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}
.intro,footer{max-width:40rem;margin:0 auto;padding:12vh 16px}
h1{font-size:2rem;line-height:1.25;margin:0 0 1rem}
.track{height:400vh;position:relative}
.sticky{position:sticky;top:0;height:100vh;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.note{position:absolute;left:16px;right:16px;bottom:10vh;max-width:26rem;background:var(--card);padding:1rem 1.25rem;opacity:0;transition:opacity .2s}
.note h2{margin:0 0 .25rem;font-size:1.25rem}.note p{margin:0;color:var(--mute)}
nav{display:none;position:absolute;top:12px;left:16px;gap:8px}
nav button{min-width:44px;min-height:44px;border:1px solid var(--fg);background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
nav button[aria-current=true]{background:var(--fg);color:var(--bg)}
nav button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.track{height:100vh}nav{display:flex}.note{transition:none}}
</style>
</head>
<body>
<section class="intro"><h1>滚动相机路径</h1><p>机制示例。向下滚动，相机沿曲线穿过 4 个站点。每站的文字叠层在相机到站时出现。</p></section>
<section class="track" id="track"><div class="sticky">
 <canvas id="c" aria-label="三维场景：相机沿路径穿过 4 个站点"></canvas>
 <nav id="nav" aria-label="站点导航"></nav>
 <div class="note"><h2>站点一</h2><p>起点。</p></div><div class="note"><h2>站点二</h2><p>相机右转。</p></div>
 <div class="note"><h2>站点三</h2><p>相机爬升。</p></div><div class="note"><h2>站点四</h2><p>终点，随后是页脚。</p></div>
</div></section>
<footer><p>页脚。滚动能到达这里。</p></footer>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const rm=matchMedia('(prefers-reduced-motion: reduce)');
const cv=document.getElementById('c'),track=document.getElementById('track'),notes=[...document.querySelectorAll('.note')],nav=document.getElementById('nav');
const r=new THREE.WebGLRenderer({canvas:cv,antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));
const sc=new THREE.Scene();sc.background=new THREE.Color(0xc8c8c8);sc.fog=new THREE.Fog(0xc8c8c8,12,40);
const cam=new THREE.PerspectiveCamera(55,1,.1,80);
sc.add(new THREE.HemisphereLight(0xffffff,0x666666,2.2));
const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(4,8,5);sc.add(dl);
const pts=[[0,1,12],[7,1.5,5],[4,4,-4],[-5,2,-11]].map(a=>new THREE.Vector3(...a));
const curve=new THREE.CatmullRomCurve3(pts,false,'catmullrom',.5);
const ST=[0,1/3,2/3,1];
const mat=new THREE.MeshStandardMaterial({color:0x8a8a8a,roughness:.7});
const geos=[new THREE.BoxGeometry(2,2,2),new THREE.ConeGeometry(1.2,2.4,5),new THREE.TorusGeometry(1.1,.4,12,32),new THREE.IcosahedronGeometry(1.3)];
ST.forEach((t,i)=>{const p=curve.getPoint(t),tg=curve.getTangent(t),side=new THREE.Vector3(-tg.z,0,tg.x).normalize();
 const m=new THREE.Mesh(geos[i],mat);m.position.copy(p).addScaledVector(side,-4.5).addScaledVector(tg,9);sc.add(m)});
const grid=new THREE.GridHelper(60,30,0x777777,0xaaaaaa);grid.position.y=-1;sc.add(grid);
function size(){const w=cv.clientWidth,h=cv.clientHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
function frame(p){ // p: 0..1
 p=Math.min(1,Math.max(0,p));cam.position.copy(curve.getPoint(p));
 cam.lookAt(curve.getPoint(Math.min(1,p+.04)).clone().lerp(curve.getPoint(Math.min(1,p+.08)),.5));
 notes.forEach((n,i)=>{n.style.opacity=Math.max(0,1-Math.abs(p-ST[i])*4).toFixed(2)});
 r.render(sc,cam);
}
function prog(){const b=track.getBoundingClientRect();return -b.top/Math.max(1,b.height-innerHeight)}
let raf=0;function onScroll(){if(rm.matches||raf)return;raf=requestAnimationFrame(()=>{raf=0;frame(prog())})}
function go(i){frame(ST[i]);notes.forEach((n,k)=>n.style.opacity=k===i?1:0);[...nav.children].forEach((b,k)=>b.setAttribute('aria-current',k===i))}
ST.forEach((_,i)=>{const b=document.createElement('button');b.textContent=i+1;b.setAttribute('aria-label','站点 '+(i+1));b.onclick=()=>go(i);nav.append(b)});
function setup(){size();rm.matches?go(0):frame(prog())}
addEventListener('scroll',onScroll,{passive:true});addEventListener('resize',setup);rm.addEventListener('change',setup);setup();
</script>
</body>
</html>
