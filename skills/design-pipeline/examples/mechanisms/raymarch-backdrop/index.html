<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>机制示例：光线步进背景</title>
<!--
机制：全屏片元着色器做 SDF 光线步进。场景是球体与盒体的平滑并集，缓慢旋转，法线着色。文字放在实色面板上，不直接压在着色器上。
来自技术卡：T04（research/R4-visual-tech.md）。
适合 / 不适合：只适合 show 档的背景层。不适合 clear 档或需要读文字的底。移动端要降分辨率。
依赖与固定版本：无。原生 WebGL 1。画布内部分辨率 640x360，DPR 固定 1，步进上限 40。
Reduce Motion 退路：time 固定，渲染一帧后停止，不启动 rAF。CSS 与 JS 都检查。
@supports 或能力退路：没有 WebGL 时隐藏画布，背景用 CSS 线性渐变。
已知限制：软件渲染一帧可能数百毫秒。动画只在指针移动或滚动后运行 2.5 秒，随后停止 rAF。标签页隐藏时停止。
不可照抄的部分：颜色与几何。只抄 map() 的平滑并集 smin、步进循环与按需 kick() 约定。
接入方法：
1. 复制 canvas、着色器字符串与 kick()。
2. 在 map() 里换自己的 SDF 组合。
3. 正文放在实色 .panel 内，保持画布 aria-hidden。
性能预算：640x360 约 23 万像素，最多 40 步，每步 2 个 SDF。每帧只上传 time 与鼠标。
-->
<style>
:root{--bg:#cfcfcf;--fg:#141414;--mute:#3a3a3a;--panel:#f4f4f4}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--fg:#f0f0f0;--mute:#c4c4c4;--panel:#242424}}
*{box-sizing:border-box}
body{margin:0;color:var(--fg);font:17px/1.7 system-ui,-apple-system,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif;background:linear-gradient(160deg,#bdbdbd,#8f8f9a)}
@media (prefers-color-scheme:dark){body{background:linear-gradient(160deg,#222,#2a2d3c)}}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
main{max-width:36rem;margin:0 auto;padding:14vh 16px 30vh}
.panel{background:var(--panel);padding:1.5rem 1.75rem;margin:0 0 70vh}
h1{font-size:2rem;line-height:1.25;margin:0 0 .75rem}p{margin:0;color:var(--mute)}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main>
<div class="panel"><h1>光线步进背景</h1><p>机制示例。背景是球体与盒体的平滑并集。文字在实色面板上，对比度不受背景影响。移动鼠标或滚动，背景转动 2.5 秒。</p></div>
<div class="panel"><p>第二块面板。滚动时背景随时间转动，停止操作后静止。</p></div>
</main>
<script>
const rm=matchMedia('(prefers-reduced-motion: reduce)'),cv=document.getElementById('bg');
const gl=cv.getContext('webgl');
if(!gl){cv.hidden=true}else{
 const W=640,H=360;cv.width=W;cv.height=H;gl.viewport(0,0,W,H);
 const dark=()=>matchMedia('(prefers-color-scheme: dark)').matches;
 const VS='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
 const FS=`precision mediump float;uniform vec2 R;uniform float T;uniform vec2 M;uniform float D;
 float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
 float map(vec3 p){float a=T*.4;float c=cos(a),s=sin(a);p.xz=mat2(c,-s,s,c)*p.xz;
  float sp=length(p-vec3(.9*sin(T*.6),0,0))-.75;vec3 q=abs(p+vec3(.5,0,0))-vec3(.6,.6,.6);
  float bx=length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.)-.08;return smin(sp,bx,.5);}
 void main(){vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;uv+=(M-.5)*.2;vec3 ro=vec3(0,0,-4.2),rd=normalize(vec3(uv,1.6));float t=0.;bool hit=false;
  for(int i=0;i<40;i++){float d=map(ro+rd*t);if(d<.003){hit=true;break;}t+=d;if(t>9.)break;}
  vec3 bg=D>.5?mix(vec3(.09,.09,.11),vec3(.17,.18,.25),uv.y+.5):mix(vec3(.74,.74,.76),vec3(.56,.56,.62),uv.y+.5);vec3 col=bg;
  if(hit){vec3 p=ro+rd*t;vec2 e=vec2(.01,0);vec3 n=normalize(vec3(map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));
   float l=max(dot(n,normalize(vec3(.5,.8,-.6))),0.);vec3 base=D>.5?vec3(.55,.6,.9):vec3(.18,.28,.8);col=base*(.25+.85*l)+pow(l,24.)*.25;}
  gl_FragColor=vec4(col,1.);}`;
 const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o};
 const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
 gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
 const l=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
 gl.uniform2f(gl.getUniformLocation(pr,'R'),W,H);
 const uT=gl.getUniformLocation(pr,'T'),uM=gl.getUniformLocation(pr,'M'),uD=gl.getUniformLocation(pr,'D');
 let t=0,mx=.5,my=.5,until=0,raf=0,last=0;
 const draw=()=>{gl.uniform1f(uT,t);gl.uniform2f(uM,mx,my);gl.uniform1f(uD,dark()?1:0);gl.drawArrays(gl.TRIANGLES,0,3)};
 function step(now){const dt=Math.min(.1,(now-last)/1000||0);last=now;t+=dt;draw();raf=(now<until&&!document.hidden)?requestAnimationFrame(step):0} // 超时后停止 rAF
 function kick(){if(rm.matches)return;until=performance.now()+2500;if(!raf){last=performance.now();raf=requestAnimationFrame(step)}}
 addEventListener('pointermove',e=>{mx=e.clientX/innerWidth;my=1-e.clientY/innerHeight;kick()},{passive:true});
 addEventListener('scroll',kick,{passive:true});
 matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);
 t=rm.matches?2.2:0;draw();
}
</script>
</body>
</html>
