<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>机制示例：Blender 无头导出 glb</title>
<!--
机制：Blender 无头建模加导出 glb，three.js GLTFLoader 加载同目录的 model.glb，缓慢自转。
来自技术卡：T23（research/R4-visual-tech.md）。加载端沿用 T02（gltf-model-stage）。
glb 来源：Blender 无头导出。命令：blender -b --python make-model.py（见本目录 make-model.py）。
  model.glb 约 40 KB，不压缩，不需要 DRACOLoader。preview.png 是同一脚本用 Cycles CPU 渲的预览。
  本机 Blender 4.0.2 缺 numpy，官方 glTF 导出器会失败，脚本自动改用内置的标准库写入器。
适合 / 不适合：适合一次性生成的程序化件（图层塔、环柱组合）。复杂有机形体、贴图烘焙不适合本机。
依赖与固定版本：three 0.186.0 与 addons/loaders/GLTFLoader.js，经 jsDelivr 加载（importmap）。
运行要求：必须经 http 访问。file:// 下浏览器禁止 fetch .glb。例：python3 -m http.server 在本目录运行。
Reduce Motion 退路：不自转，只渲染一帧。
加载失败：页面显示说明文字，不留空画布。
已知限制：光照用 HemisphereLight 与平行光，没有 HDR 环境图，金属反射偏暗。
不可照抄的部分：模型形状、颜色、文案。只抄 Blender 管线与 loader 写法。
接入方法：
1. 改 make-model.py 的建模段，运行命令得到新 model.glb。
2. 把 model.glb 放到页面同目录，必要时调整 fit() 的目标尺寸。
3. 保持 RM 分支。
-->
<style>
:root{--bg:#d9d9d9;--fg:#161616;--mute:#444;--card:#f2f2f2}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1c;--fg:#eee;--mute:#b5b5b5;--card:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.7 system-ui,-apple-system,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}
main{max-width:56rem;margin:0 auto;padding:8vh 16px}
h1{font-size:2rem;line-height:1.25;margin:0 0 1rem}p{color:var(--mute)}
.stage{height:60vh;min-height:320px;background:var(--card);position:relative;margin-top:1.5rem}
canvas{width:100%;height:100%;display:block}
#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:16px;text-align:center}
</style>
</head>
<body>
<main>
<h1>Blender 无头导出 glb</h1>
<p>机制示例。本页加载 model.glb。它由 make-model.py 在 Blender 里无头生成：六块倒角薄板螺旋叠放，中间一根细柱。</p>
<div class="stage"><canvas id="c" aria-label="三维模型：橙色金属图层塔"></canvas><div id="msg">模型加载失败。请经 http 访问本页，并先运行 blender -b --python make-model.py。</div></div>
</main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const rm=matchMedia('(prefers-reduced-motion: reduce)');
const cv=document.getElementById('c');
const r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,2));
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,.1,50);cam.position.set(0,1.4,4.4);cam.lookAt(0,0,0);
sc.add(new THREE.HemisphereLight(0xffffff,0x555555,2));
const dl=new THREE.DirectionalLight(0xffffff,3);dl.position.set(3,4,5);sc.add(dl);
const rim=new THREE.DirectionalLight(0xffffff,1.5);rim.position.set(-4,1,-3);sc.add(rim);
let model=null,raf=0;
function size(){const w=cv.clientWidth,h=cv.clientHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();if(rm.matches)r.render(sc,cam)}
function fit(o){const b=new THREE.Box3().setFromObject(o),s=new THREE.Vector3();b.getSize(s);o.scale.setScalar(1.9/Math.max(s.x,s.y,s.z));o.position.sub(b.getCenter(new THREE.Vector3()).multiplyScalar(o.scale.x))}
function loop(){model.rotation.y+=.008;model.rotation.x=.5;r.render(sc,cam);raf=requestAnimationFrame(loop)}
function setup(){cancelAnimationFrame(raf);raf=0;if(!model)return;model.rotation.set(.5,.6,0);if(rm.matches)r.render(sc,cam);else loop()}
new GLTFLoader().load('./model.glb',g=>{model=g.scene;fit(model);sc.add(model);size();setup()},undefined,()=>{document.getElementById('msg').style.display='flex'});
addEventListener('resize',size);rm.addEventListener('change',setup);size();
</script>
</body>
</html>
