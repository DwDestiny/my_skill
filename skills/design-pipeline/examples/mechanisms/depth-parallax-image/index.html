<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>机制示例：深度图视差</title>
<!--
机制：一张彩色图加一张深度图，片元着色器按深度位移采样坐标，得到 2.5D 视差。位移来自指针（x、y）和滚动（y）。
来自技术卡：T27（research/R4-visual-tech.md）。
本示例没有真实深度图：彩色图与深度图都由 2D canvas 程序生成（几何体、渐变）。换成真图时，深度图用灰度，亮为近。
适合 / 不适合：适合照片或插画的轻量空间感。不适合深度边缘锐利的图（会出现拉伸）。
依赖与固定版本：无，原生 WebGL2。
位移上限：off 上限 0.06，乘深度偏移（绝对值不超过 0.5），采样坐标最大位移 0.03（图宽的 3%，不超过 8%）。
Reduce Motion 退路：位移固定为 0，渲染一帧后停止，不监听指针与滚动。CSS 与 JS 都检查。
已知限制：位移到图边会取到边缘像素（CLAMP）。图外留 8% 余量更好。
不可照抄的部分：生成的图形、颜色、文案。只抄着色器里的位移公式与指针加滚动的合成。
接入方法：
1. 复制 canvas、着色器与 loop() 函数。
2. 把 makeColor() 与 makeDepth() 换成 Image 加载的两张图。
3. 保持 MAX 不超过 0.08。
-->
<style>
:root{--bg:#d9d9d9;--fg:#161616;--mute:#444}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1c;--fg:#eee;--mute:#b5b5b5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.7 system-ui,-apple-system,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}
main{max-width:56rem;margin:0 auto;padding:8vh 16px 60vh}
h1{font-size:2rem;line-height:1.25;margin:0 0 1rem}p{color:var(--mute)}
.frame{position:relative;aspect-ratio:3/2;margin:1.5rem 0}
#cv{width:100%;height:100%;display:block}
.dm{position:absolute;right:8px;bottom:8px;width:120px;height:80px;border:2px solid var(--bg)}
</style>
</head>
<body>
<main>
<h1>深度图视差</h1>
<p>机制示例。在图上移动指针，或上下滚动页面：近处的形状位移多，远处位移少。右下角的小图是程序生成的深度图。</p>
<div class="frame"><canvas id="cv" width="960" height="640" aria-label="程序生成的几何图形，带深度视差"></canvas><canvas id="dm" class="dm" width="120" height="80" aria-hidden="true"></canvas></div>
<p>页面继续向下滚动，图的垂直位移会随滚动变化。</p>
</main>
<script>
(()=>{
const W=960,H=640,MAX=.06,rm=matchMedia('(prefers-reduced-motion: reduce)');
function mk(){const c=document.createElement('canvas');c.width=W;c.height=H;return[c,c.getContext('2d')]}
const shapes=[ // 远到近：[类型, x, y, 尺寸, 灰度深度, 颜色]
 ['c',480,380,420,.25,'#7d7d7d'],['r',200,330,260,.5,'#9a9a9a'],['r',700,300,240,.55,'#5e5e5e'],['c',480,330,170,.9,'#d8d8d8'],['r',150,520,150,.95,'#2f2f2f']];
function makeColor(){const[c,x]=mk();const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#c9c9c9');g.addColorStop(1,'#8c8c8c');x.fillStyle=g;x.fillRect(0,0,W,H);
 shapes.forEach(s=>{x.fillStyle=s[5];x.beginPath();s[0]=='c'?x.arc(s[1],s[2],s[3]/2,0,7):x.rect(s[1]-s[3]/2,s[2]-s[3]/2,s[3],s[3]);x.fill()});return c}
function makeDepth(){const[c,x]=mk();x.fillStyle='#202020';x.fillRect(0,0,W,H);
 shapes.forEach(s=>{const v=Math.round(s[4]*255);x.fillStyle=`rgb(${v},${v},${v})`;x.beginPath();s[0]=='c'?x.arc(s[1],s[2],s[3]/2,0,7):x.rect(s[1]-s[3]/2,s[2]-s[3]/2,s[3],s[3]);x.fill()});return c}
const col=makeColor(),dep=makeDepth();
const dx=document.getElementById('dm').getContext('2d');dx.drawImage(dep,0,0,120,80);
const cv=document.getElementById('cv'),gl=cv.getContext('webgl2');
if(!gl){cv.getContext('2d').drawImage(col,0,0);return}
const mkS=(t,s)=>{const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(x));return x};
const p=gl.createProgram();
gl.attachShader(p,mkS(gl.VERTEX_SHADER,'#version 300 es\nin vec2 a;out vec2 uv;void main(){uv=vec2(a.x*.5+.5,.5-a.y*.5);gl_Position=vec4(a,0,1);}'));
gl.attachShader(p,mkS(gl.FRAGMENT_SHADER,`#version 300 es
precision mediump float;in vec2 uv;out vec4 o;uniform sampler2D c,d;uniform vec2 off;
void main(){float z=texture(d,uv).r-.5; // 近为正
 o=texture(c,uv+off*z);}`));
gl.bindAttribLocation(p,0,'a');gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))console.error(gl.getProgramInfoLog(p));gl.useProgram(p);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
[col,dep].forEach((im,i)=>{gl.activeTexture(gl.TEXTURE0+i);gl.bindTexture(gl.TEXTURE_2D,gl.createTexture());gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);
 [gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.LINEAR));[gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.CLAMP_TO_EDGE))});
gl.uniform1i(gl.getUniformLocation(p,'c'),0);gl.uniform1i(gl.getUniformLocation(p,'d'),1);
let tx=0,ty=0,cx=0,cy=0,raf=0,sy=0;
function loop(){cx+=(tx-cx)*.1;cy+=(ty-cy)*.1;const k=[cx,cy];
 gl.uniform2f(gl.getUniformLocation(p,'off'),Math.max(-MAX,Math.min(MAX,k[0]*MAX)),Math.max(-MAX,Math.min(MAX,(k[1]+sy)*MAX)));
 gl.drawArrays(gl.TRIANGLE_STRIP,0,4);raf=requestAnimationFrame(loop)}
function setup(){cancelAnimationFrame(raf);raf=0;if(rm.matches){gl.uniform2f(gl.getUniformLocation(p,'off'),0,0);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}else loop()}
addEventListener('pointermove',e=>{if(rm.matches)return;const r=cv.getBoundingClientRect();tx=((e.clientX-r.left)/r.width-.5)*2;ty=((e.clientY-r.top)/r.height-.5)*2});
addEventListener('scroll',()=>{sy=Math.max(-1,Math.min(1,scrollY/innerHeight-.5))},{passive:true});
rm.addEventListener('change',setup);setup();
})();
</script>
</body>
</html>
