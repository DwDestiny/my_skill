<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>机制示例：网格渐变</title>
<!--
机制：片元着色器把 5 个控制色按漂移的控制点做距离加权融合，叠一层低幅噪声，画成液态背景。控制色读自 CSS 变量 --c1 到 --c5。页面读回像素，实测正文区对比度。
来自技术卡：T12（research/R4-visual-tech.md）。
适合 / 不适合：适合三档的背景层。clear 档只作背景，且必须实测正文区对比度。不适合当内容图或需要精确色彩的图表底。
依赖与固定版本：无。原生 WebGL 1。画布内部分辨率 480x270，DPR 固定 1。
Reduce Motion 退路：只渲染一帧（time 固定），不启动 rAF。CSS 与 JS 都检查。
@supports 或能力退路：没有 WebGL 时隐藏画布，body 用 CSS 多层 radial-gradient 显示同色静态背景。
已知限制：readPixels 对比度是抽样近似，不替代真机检查。色斑亮度差过大会拉低对比度。标签页隐藏时停止 rAF。
不可照抄的部分：颜色与版式。只抄着色器、控制色读取 cols() 与 contrast() 实测函数。
接入方法：
1. 复制 canvas、着色器字符串、cols()、frame() 与 contrast()。
2. 在 :root 设 --c1 到 --c5，并给暗色模式另设一组。
3. 正文放在 .text 容器，contrast() 读取该容器的区域。
性能预算：480x270 画布，5 个控制点，每像素约 40 次运算。每帧只上传 1 个 time 与 10 个坐标。
-->
<style>
:root{--bg:#d8d8d8;--fg:#141414;--mute:#3a3a3a;--c1:#e8e8e8;--c2:#cfcfcf;--c3:#dcdcdc;--c4:#c4c4c4;--c5:#b9bcc8;--acc:#2f4bd8}
@media (prefers-color-scheme:dark){:root{--bg:#1a1a1a;--fg:#f0f0f0;--mute:#c4c4c4;--c1:#1c1c1c;--c2:#2c2c2c;--c3:#232323;--c4:#303030;--c5:#2a3050}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--fg);font:17px/1.7 system-ui,-apple-system,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif;
 background:radial-gradient(60% 60% at 20% 20%,var(--c1),transparent),radial-gradient(60% 60% at 80% 30%,var(--c5),transparent),radial-gradient(70% 70% at 50% 90%,var(--c4),transparent),var(--c2)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
main{max-width:40rem;margin:0 auto;padding:12vh 16px}
h1{font-size:2.25rem;line-height:1.2;margin:0 0 1rem}
.text p{color:var(--mute);margin:0 0 1rem}
code,output{font-variant-numeric:tabular-nums}
output{display:inline-block;padding:.25rem .75rem;border:1px solid var(--fg)}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main><div class="text" id="text">
<h1>网格渐变</h1>
<p>机制示例。背景是 5 个控制色的慢速漂移融合。这段文字在背景上，页面实测它所在区域的对比度。</p>
<p>实测结果：<output id="out">测量中</output></p>
</div></main>
<script>
const rm=matchMedia('(prefers-reduced-motion: reduce)');
const cv=document.getElementById('bg'),out=document.getElementById('out');
const gl=cv.getContext('webgl',{preserveDrawingBuffer:true});
const lum=c=>{const f=v=>{v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(c[0])+.7152*f(c[1])+.0722*f(c[2])};
function cols(){const s=getComputedStyle(document.documentElement),a=[];
 for(let i=1;i<=5;i++){const t=document.createElement('i');t.style.color=s.getPropertyValue('--c'+i);document.body.append(t);
  a.push(getComputedStyle(t).color.match(/\d+/g).slice(0,3).map(Number));t.remove()}return a}
if(!gl){cv.hidden=true;out.textContent='无 WebGL，使用 CSS 静态背景'}else{
 const VS='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
 const FS=`precision mediump float;uniform vec2 R;uniform float T;uniform vec3 C[5];
 float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
 float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
 void main(){vec2 uv=gl_FragCoord.xy/R;uv.x*=R.x/R.y;vec3 c=vec3(0.);float w=0.;
 for(int i=0;i<5;i++){float a=float(i)*1.7;vec2 q=vec2(.5+.35*sin(T*.15+a),.5+.35*cos(T*.12+a*1.3));q.x*=R.x/R.y;
  float d=distance(uv,q)+.15*n(uv*2.+T*.05+a);float k=1./(d*d+.03);c+=C[i]*k;w+=k;}
 gl_FragColor=vec4(c/w,1.);}`;
 const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o};
 const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
 gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
 const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
 cv.width=480;cv.height=270;gl.viewport(0,0,480,270);
 const uT=gl.getUniformLocation(pr,'T');gl.uniform2f(gl.getUniformLocation(pr,'R'),480,270);
 function setCols(){gl.uniform3fv(gl.getUniformLocation(pr,'C'),new Float32Array(cols().flat().map(v=>v/255)))}
 function frame(t){gl.uniform1f(uT,t);gl.drawArrays(gl.TRIANGLES,0,3)}
 function contrast(){ // 读回像素，取正文区最差对比度
  const px=new Uint8Array(480*270*4);gl.readPixels(0,0,480,270,gl.RGBA,gl.UNSIGNED_BYTE,px);
  const r=document.getElementById('text').getBoundingClientRect(),W=innerWidth,H=innerHeight;
  const x0=Math.max(0,r.left/W*480|0),x1=Math.min(479,r.right/W*480|0),y0=Math.max(0,r.top/H*270|0),y1=Math.min(269,r.bottom/H*270|0);
  let lo=9,hi=0;for(let y=y0;y<=y1;y+=3)for(let x=x0;x<=x1;x+=3){const i=((269-y)*480+x)*4,l=lum([px[i],px[i+1],px[i+2]]);lo=Math.min(lo,l);hi=Math.max(hi,l)}
  const fg=lum(getComputedStyle(document.body).color.match(/\d+/g).map(Number)),a=fg<.5?lo:hi;
  const cr=(Math.max(a,fg)+.05)/(Math.min(a,fg)+.05);out.textContent=cr.toFixed(1)+' : 1 '+(cr>=4.5?'通过 4.5':'不足 4.5')}
 let raf=0,t0=performance.now();
 function loop(){frame((performance.now()-t0)/1000);raf=document.hidden?0:requestAnimationFrame(loop)}
 function start(){cancelAnimationFrame(raf);setCols();if(rm.matches){frame(3)}else loop();setTimeout(contrast,80)}
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!rm.matches&&!raf)loop()});
 matchMedia('(prefers-color-scheme: dark)').addEventListener('change',start);rm.addEventListener('change',start);addEventListener('resize',()=>setTimeout(contrast,80));start();
}
</script>
</body>
</html>
