<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手绘讲课页</title>
<!--
  Input: hand-drawn.js（画具包）、fonts/marker.woff2 + fonts/hand.woff2（子集字体，OFL-1.1）
  Output: 两屏演示：首屏问题 + 配图（左右两栏），第二屏“六步 × 四条线”教学图（悬停切层）
  Pos: hand-drawn 手法的起手页兼效果演示页。题材是一门中性的手作面包课；换题材时改 STEPS / ROWS / 文案与两个 geo 函数
  调试参数：?p=2 直接到第二屏；?row=0..3 选中第几条线；?only=2 只显示第二屏（截图用）
-->
<style>
  /* 字：标题用霞鹜漫黑（记号笔），正文与批注用小赖（细钢笔）。两款均 OFL-1.1，见 fonts/ */
  @font-face { font-family:"HD Marker"; src:url(fonts/marker.woff2) format("woff2"); font-display:block; }
  @font-face { font-family:"HD Hand"; src:url(fonts/hand.woff2) format("woff2"); font-display:block; }
  :root {
    --paper:#f1e9d6; --ink:#2b2420; --mute:#5b5147; --rule:#b3a487; --graphite:#8f8471;
    --c0:#e0a84f; --c0-ink:#83540e;
    --c1:#86b596; --c1-ink:#2b6650;
    --c2:#e39478; --c2-ink:#9b3f27;
    --c3:#86a6d8; --c3-ink:#2b5085;
    --marker:"HD Marker","Kaiti SC","STKaiti",cursive;
    --hand:"HD Hand","Kaiti SC","STKaiti",cursive;
    --ease:cubic-bezier(.22,.61,.36,1);
    --flow-in:cubic-bezier(.2,.75,.35,1);
  }
  * { box-sizing:border-box; }
  /* 纸：脚本生成一张可平铺的纸纹，铺在整页，随页面滚动 */
  html { margin:0; background-color:var(--paper); background-image:var(--paper-img, none); background-size:512px 512px; }
  body { margin:0; background:transparent; color:var(--ink); font-family:var(--hand); overflow-x:hidden; }
  /* 纸的大块明暗：几团极淡的深浅加四角略暗，固定在视口 */
  body::before { content:""; position:fixed; inset:0; pointer-events:none; z-index:0; mix-blend-mode:multiply;
    background:
      radial-gradient(55% 45% at 16% 20%, rgba(150,118,70,.05), transparent 70%),
      radial-gradient(45% 55% at 84% 78%, rgba(150,118,70,.06), transparent 70%),
      radial-gradient(130% 120% at 50% 45%, transparent 62%, rgba(120,92,58,.10) 100%); }
  /* 容器不设 z-index：设了就成隔离组，里面的 multiply 压不到纸纹 */
  main { position:relative; }
  .screen { position:relative; min-height:100vh; padding:64px 72px; }
  .deco { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; mix-blend-mode:multiply; }
  .kicker { position:relative; font-size:20px; line-height:1.55; color:var(--mute); letter-spacing:.04em; margin:0 0 18px; }
  .ch { display:inline-block; }
  @media (min-width:761px) { .kicker .nw { white-space:nowrap; } }
  /* 墨落在纸上：大字在纸的深坑处缺一点墨 */
  h1, h2, .name, .lb.mk { -webkit-mask-image:var(--ink-mask, none); mask-image:var(--ink-mask, none); -webkit-mask-size:512px 512px; mask-size:512px 512px; }
  /* 手写字的“抖”：悬停或刚被选中时，字一拍一拍跳一下（逐字错开 30ms） */
  @keyframes boil {
    0% { translate:0 0; rotate:0deg; } 33% { translate:0 -.04em; rotate:2.4deg; }
    66% { translate:0 .02em; rotate:-1.8deg; } 100% { translate:0 0; rotate:0deg; }
  }
  li button:hover .name .ch, li.on .name .ch, .s1 .mk:hover .ch, .lb.band.on .ch { animation:boil .42s steps(1, end) calc(var(--i, 0) * 30ms) 1; }

  /* 第一屏：一整幅钢笔场景铺满屏，标题放在场景左上的留白里 */
  .s1 { display:block; overflow:hidden; }
  .s1 .head { position:relative; max-width:60%; }
  .s1 .q { position:relative; font-family:var(--marker); font-weight:400; font-size:clamp(34px, 4.4vw, 76px); line-height:1.3; margin:0; letter-spacing:.01em; }
  .s1 .mk, .s1 .nw { white-space:nowrap; }
  .s1 .ul { position:absolute; pointer-events:none; mix-blend-mode:multiply; clip-path:inset(0 100% 0 0); }
  .hint { position:absolute; right:72px; bottom:40px; margin:0; font-size:18px; color:var(--mute); }
  .key { display:inline-block; padding:0 .5em; margin:0 .3em; }
  /* 场景：一块大画布画桌面与静物；配方书、烤盘的烟单独成层，好做悬停和抖动 */
  .scene { position:absolute; inset:0; pointer-events:none; }
  .scene canvas { position:absolute; pointer-events:none; }
  .sc-base, .sc-smoke { mix-blend-mode:multiply; }
  .sc-hit { position:absolute; pointer-events:auto; }
  .sc-book { opacity:0; transform:translateY(-18px) rotate(-3deg); transform-origin:50% 100%;
    transition:opacity .3s var(--ease), transform .75s cubic-bezier(.34,1.5,.64,1); }
  .sc-base { clip-path:inset(0 100% 0 0); transition:clip-path 1.8s var(--flow-in) .2s; }
  .sc-arrow { clip-path:inset(0 100% 0 0); transition:clip-path 1.4s var(--flow-in) 1.6s; mix-blend-mode:multiply; }
  .sc-smokeg, .sl { opacity:0; transition:opacity 1.2s var(--ease) 2.4s; }
  .sc-smokeg { position:absolute; inset:0; }
  /* 烤坏的面包上冒的烟：三帧轮换，只换线的种子 */
  .sc-smoke { width:100%; height:100%; opacity:0; animation:flick 1.05s linear infinite; }
  .sc-smoke:nth-child(2) { animation-delay:-.35s; } .sc-smoke:nth-child(3) { animation-delay:-.7s; }
  @keyframes flick { 0%, 33.3% { opacity:1; } 33.4%, 100% { opacity:0; } }
  .sl { position:absolute; transform:translate(-50%, -50%); color:var(--mute); white-space:nowrap; line-height:1; }
  .s1.go .sc-book { opacity:1; transform:none; }
  .s1.go .sc-hit:hover + .sc-book { transform:translateY(-10px) rotate(1.5deg); transition-duration:.3s, .45s; }
  .s1.go .sc-base, .s1.go .sc-arrow { clip-path:inset(0 0 0 0); }
  .s1.go .sc-smokeg { opacity:1; }
  .s1.go .sl { opacity:.95; }
  .s1.go #ul-a { clip-path:inset(0 0 0 0); transition:clip-path .65s var(--ease) .25s; }
  .s1.go #ul-b { clip-path:inset(0 0 0 0); transition:clip-path 1.5s var(--flow-in) .8s; }

  /* 第二屏：左列表，右教学图 */
  .s2 { display:grid; grid-template-columns:35fr 65fr; gap:56px; align-items:center; }
  .s2 > div, .s2 > figure { position:relative; }
  h2 { font-family:var(--marker); font-weight:400; font-size:clamp(32px, 2.9vw, 46px); line-height:1.3; margin:0 0 38px; }
  ol { list-style:none; margin:0; padding:0; display:grid; gap:24px; }
  li { position:relative; }
  li canvas { position:absolute; left:-14px; top:-10px; width:calc(100% + 28px); height:calc(100% + 20px); pointer-events:none; mix-blend-mode:multiply; }
  li .hl { opacity:0; clip-path:inset(0 100% 0 0); transition:opacity .3s var(--ease), clip-path 0s linear .3s; }
  li.on .hl { opacity:1; clip-path:inset(0 0 0 0); transition:opacity .15s var(--ease), clip-path .6s var(--ease); }
  li:not(.on) .db { opacity:.45; }
  li .db { transition:opacity .36s var(--ease); }
  li button { all:unset; position:relative; cursor:pointer; display:grid; grid-template-columns:22px 1fr; column-gap:14px; }
  li button:focus-visible { outline:2px dashed var(--ink); outline-offset:8px; border-radius:6px; }
  .dot { width:17px; height:17px; margin-top:12px; }
  .name { font-family:var(--marker); font-size:28px; line-height:1.4; transition:color .36s var(--ease); }
  .desc .nw { white-space:nowrap; }
  .desc { text-wrap:balance; grid-column:2; font-size:20px; line-height:1.6; color:var(--mute); margin-top:2px; }
  li button[aria-pressed="false"] .name { color:var(--mute) !important; }
  figure { margin:0; }
  /* 图贴在一张浅色卡纸上（z-index:-1 垫在后面），两角压胶带 */
  .fig-card { position:absolute; left:-30px; top:-30px; width:calc(100% + 60px); height:calc(100% + 60px); z-index:-1; pointer-events:none; }
  .plate { position:relative; width:100%; aspect-ratio:1000/600; container-type:inline-size; }
  .plate.vert { aspect-ratio:360/680; }
  .plate canvas { position:absolute; inset:0; width:100%; height:100%; mix-blend-mode:multiply; pointer-events:none; }
  .ov { opacity:0; clip-path:inset(0 100% 0 0); transition:opacity .35s var(--ease), clip-path 0s linear .35s; }
  .vert .ov { clip-path:inset(0 0 100% 0); }
  .ov.on { opacity:1; clip-path:inset(0 0 0 0); transition:opacity .2s var(--ease), clip-path .95s var(--ease); }
  .reset .ov, .reset li .hl { transition:none !important; }
  .labels { position:absolute; inset:0; pointer-events:none; }
  .lb { position:absolute; white-space:nowrap; line-height:1; }
  .lb.mk { font-family:var(--marker); }
  .lb.band { color:var(--mute); transition:color .36s var(--ease); }
  .lb.band.on { color:var(--c); }

  @media (max-width:760px) {
    .screen { padding:32px 16px 40px; min-height:auto; }
    .s1 { min-height:100svh; }
    .s1 .head { max-width:none; }
    .s1 .q { font-size:38px; }
    .hint { right:auto; left:16px; bottom:20px; }
    .s2 { grid-template-columns:1fr; gap:34px; align-items:start; }
    h2 { font-size:31px; margin-bottom:22px; }
    .kicker { font-size:15px; }
    .kicker .nw:first-child { display:block; width:fit-content; }
    ol { gap:16px; }
    .name { font-size:22px; }
    .desc { font-size:17px; }
    .dot { margin-top:8px; width:15px; height:15px; }
    .fig-card { left:-9px; top:-14px; width:calc(100% + 18px); height:calc(100% + 28px); }
  }
  @media (min-width:761px) { html { scroll-snap-type:y mandatory; } .screen { scroll-snap-align:start; } }
  @media (prefers-reduced-motion:reduce) {
    li .hl, li.on .hl, li .db, .name, .lb.band, .ov, .ov.on, .sc-book, .sc-base, .sc-arrow, .sc-smokeg, .sl, .s1 .ul, .s1.go .ul { transition:none !important; }
    .sc-smoke { animation:none !important; } .sc-smoke:first-child { opacity:1; }
    .ch { animation:none !important; }
  }
</style>
</head>
<body>
<main>
  <section class="screen s1" id="p1" aria-label="第 1 屏">
    <canvas class="deco" id="c1" aria-hidden="true"></canvas>
    <div class="head" id="head">
      <canvas class="ul" id="ul-a" aria-hidden="true"></canvas>
      <canvas class="ul" id="ul-b" aria-hidden="true"></canvas>
      <p class="kicker"><span class="tag">手作面包课 · 开场</span></p>
      <h1 class="q"><span class="nw">照着配方做面包，</span><span class="nw">为什么常常</span><br><span class="mk" id="mk-a">看得懂</span>、<span class="mk" id="mk-b">做不好</span>？</h1>
    </div>
    <figure class="scene" id="scene" role="img" aria-label="木桌上摊开一本配方书，书上画着一只饱满的面包；照着做，烤盘里却是一只塌掉、烤焦的面包">
      <canvas class="sc-base" id="sc-base"></canvas>
      <canvas class="sc-arrow" id="sc-arrow"></canvas>
      <div class="sc-smokeg"><canvas class="sc-smoke"></canvas><canvas class="sc-smoke"></canvas><canvas class="sc-smoke"></canvas></div>
      <i class="sc-hit" id="sc-hit"></i>
      <canvas class="sc-book" id="sc-book"></canvas>
      <span class="sl" id="sl-a">配方上</span><span class="sl" id="sl-b">照着做</span><span class="sl" id="sl-c">烤出来</span>
    </figure>
    <p class="hint">按<span class="key" id="key">→</span>翻页</p>
  </section>

  <section class="screen s2" id="p2" aria-label="第 2 屏">
    <canvas class="deco" id="c2" aria-hidden="true"></canvas>
    <div>
      <p class="kicker"><span class="nw tag">第 3 课 · 怎样做：</span><span class="nw">把一块面团从和面做到出炉</span></p>
      <h2>四条线：每一步都要<br>照看的四样东西</h2>
      <ol id="list"></ol>
    </div>
    <figure aria-label="图 2 六步四线：四样东西横跨六个步骤，越往后越要紧">
      <canvas class="fig-card" id="fig-card" aria-hidden="true"></canvas>
      <div class="plate" id="plate">
        <canvas id="base" aria-hidden="true"></canvas>
        <canvas id="top" aria-hidden="true"></canvas>
        <div class="labels" id="labels" aria-hidden="true"></div>
      </div>
    </figure>
  </section>
</main>
<script src="hand-drawn.js"></script>
<script>
// ---------- 内容：换题材时只改这里和两个 geo 函数 ----------
const STEPS = ["选粉","和面","发酵","整形","烘烤","出炉"];
const ROWS = [
  {name:"风味", desc:"麦香、酸甜和咸淡，决定这块面包值不值得做。"},
  {name:"筋度", desc:"面筋怎样长出来，揉多久，<span class=\"nw\">停在哪一刻</span>。"},
  {name:"湿度", desc:"面团的含水和手感，表皮与内心的干湿。"},
  {name:"温度", desc:"面温、室温和炉温，<span class=\"nw\">决定发酵快慢</span>与上色。"},
];
const CAPTION = "四条线不是第七步：每一步都要照看，越往后越要紧";
const FIG_NO = "图 2 · 六步四线", AXIS = "制作推进";

const HD = HandDrawn, DPR = HD.DPR, {pen, pencil, ring, rbox, tape, sparkle, paperCard, paperize, place, placeIn, fitTo, rng, noise1, bez} = HD;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
const mq = matchMedia("(max-width:760px)");

// ---------- 教学图版面：u 是推进方向，w 是横穿方向；横版 x=u，竖版 y=u ----------
function geo(vert) {
  return vert
    ? {vert, W:360, H:680, a0:96, aEnd:600, tip:18, bw:46, gap:10, c0:118}
    : {vert, W:1000, H:600, a0:24, aEnd:834, tip:26, bw:72, gap:22, c0:136};
}
const XY = (g, u, w) => g.vert ? [w, u] : [u, w];
const UV = (g, x, y) => g.vert ? [y, x] : [x, y];
const bandC = (g, j) => g.c0 + j * (g.bw + g.gap);
const stepW = g => (g.aEnd - g.a0) / STEPS.length;
const stepOf = (g, u) => Math.min(5, Math.max(0, Math.floor((u - g.a0) / stepW(g))));

// 一条色带：两边略抖的长带，末端收成箭头，表示一路贯穿
function bandUV(g, j) {
  const c = bandC(g, j), n = noise1(300 + j), L = g.aEnd - g.a0, N = Math.ceil(L / 6), pts = [];
  for (let i = 0; i <= N; i++) pts.push([g.a0 + L * i / N, c + (n(i * .33) - .5) * 2.4]);
  pts.push([g.aEnd + g.tip, c + g.bw / 2]);
  for (let i = N; i >= 0; i--) pts.push([g.a0 + L * i / N, c + g.bw + (n(90 + i * .33) - .5) * 2.4]);
  pts.push([g.a0 + (n(7) - .5) * 3, c + g.bw * .5]);
  return pts;
}
// 深度：每过一步深一档；同一带里下沿更暗、上沿留一道亮
function tone(g, j, u, w) {
  const d = stepOf(g, u) / 5, s = (w - bandC(g, j)) / g.bw;
  return .78 * d + .34 * Math.pow(Math.max(0, s), 1.4) * (.3 + .7 * d) - (s < .17 ? .3 : 0);
}
function drawBand(c, g, j, active) {
  const uv = bandUV(g, j), clip = uv.map(([u, w]) => XY(g, u, w)), box = HD.bounds(clip), col = css(`--c${j}`);
  pencil(c, clip, box, {
    seed: 50 + j + (active ? 7 : 0), color: col, angle: -1.08, len: 13, w: 1.6,
    density: active ? .28 : .12, tooth: active ? .5 : .65, op: active ? 1 : .3,
    alpha: (x, y) => { const [u, w] = UV(g, x, y), s = (w - bandC(g, j)) / g.bw;
      return active ? Math.max(.06, .16 + .74 * stepOf(g, u) / 5 - (s < .15 ? .2 : 0)) : .55; },
  });
  if (active) {
    // 排线顺着带走；每根线在步与步的分界处错开起笔，越往后墨越实
    const shift = lr => (lr - .5) * stepW(g) * .45;
    HD.HATCH_LAYERS.forEach(L => HD.hatch(c, clip, box, Object.assign({}, L, {
      seed: 1000 + j * 10 + L.seed, angle: g.vert ? Math.PI / 2 - L.angle : L.angle,
      tone: (x, y, lr) => { const [u, w] = UV(g, x, y); return tone(g, j, u + shift(lr), w); },
      level: (x, y, lr) => stepOf(g, UV(g, x, y)[0] + shift(lr)) / 5,
    })));
  }
  pen(c, clip, {closed: true, w: active ? 1.5 : 1.05, alpha: active ? 1 : .38, seed: 70 + j, jit: .6});
  if (active) { // 下沿是背光的一边，再压一道粗线
    const bot = uv.filter(([u, w]) => w > bandC(g, j) + g.bw * .8 && u <= g.aEnd).sort((a, b) => a[0] - b[0]).map(([u, w]) => XY(g, u, w));
    pen(c, bot, {w: 2.1, seed: 90 + j, jit: .5, alpha: .9});
  }
}
function drawBase(c, g) {
  const sw = stepW(g);
  STEPS.forEach((_, i) => { // 六步：手画圆圈加浅铅笔底
    const u = g.a0 + sw * (i + .5), [cx, cy] = g.vert ? [16, u - 14] : [u, 34], R = g.vert ? 11 : 15, rg = ring(cx, cy, R, 405 + i);
    pencil(c, rg.slice(0, 37), [cx - R, cy - R, cx + R, cy + R], {seed: 400 + i, color: "#b8a98d", len: 7, w: 1.2, density: .5, alpha: () => .55});
    pen(c, rg, {w: 1.25, seed: 410 + i, jit: .5});
  });
  const axis = g.vert ? [[106, 84], [106, 640]] : [[12, 106], [868, 106]]; // 推进方向：一根钢笔轴线，手画箭头
  pen(c, axis, {w: 1.3, seed: 500, jit: .7});
  const [ex, ey] = axis[1], hd = g.vert ? [[-6, -12], [6, -12]] : [[-13, -6], [-13, 6]];
  hd.forEach(([dx, dy], k) => pen(c, [[ex + dx, ey + dy], [ex, ey]], {w: 1.3, seed: 510 + k, jit: .3}));
  ROWS.forEach((_, j) => drawBand(c, g, j, false));
}
function drawTop(c, g, capEnd) {
  const sw = stepW(g), bEnd = bandC(g, 3) + g.bw;
  for (let i = 1; i < STEPS.length; i++) { // 六步分隔：浅色虚线穿过四条带
    const u = g.a0 + sw * i, r = rng(600 + i);
    for (let w = g.c0 - 12; w < bEnd + 10; w += 9)
      pen(c, [XY(g, u + (r() - .5) * 1.2, w), XY(g, u + (r() - .5) * 1.2, w + 4.5)], {w: .9, alpha: .7, color: css("--rule"), seed: 620 + i * 50 + w, jit: .2});
  }
  if (!g.vert) { // 图注箭头：从图注右端起笔，指向最深的一端
    const p = [], n = noise1(800), P0 = [capEnd + 12, 554], P1 = [capEnd + (796 - capEnd) * .65, 557], P2 = [796, 500];
    for (let t = 0; t <= 1.0001; t += .04) { const m = 1 - t; p.push([m * m * P0[0] + 2 * m * t * P1[0] + t * t * P2[0], m * m * P0[1] + 2 * m * t * P1[1] + t * t * P2[1] + (n(t * 9) - .5)]); }
    pen(c, p, {w: 1.1, seed: 801, jit: .4, alpha: .85});
    const [x2, y2] = p[p.length - 1], [x1, y1] = p[p.length - 3], a = Math.atan2(y2 - y1, x2 - x1);
    [a + 2.6, a - 2.6].forEach((b, k) => pen(c, [[x2 + Math.cos(b) * 10, y2 + Math.sin(b) * 10], [x2, y2]], {w: 1.1, seed: 810 + k, jit: .2, alpha: .85}));
  }
}
function drawLabels(box, g) {
  box.innerHTML = ""; const sw = stepW(g), L = (x, y, t, o) => HD.label(box, g.W, g.H, x, y, t, o);
  STEPS.forEach((t, i) => {
    const u = g.a0 + sw * (i + .5);
    if (g.vert) { L(16, u - 13, String(i + 1), {size: 14, jitter: 30 + i}); L(32, u - 14, t, {size: 16, cls: "mk", ax: 0, jitter: 20 + i}); }
    else { L(u, 35, String(i + 1), {size: 18, jitter: 30 + i}); L(u, 76, t, {size: 21, cls: "mk", jitter: 20 + i}); }
  });

function drawTray(c) {
  const top = [[-124, -36], [124, -36], [142, -6], [-142, -6]], lip = [[-142, -6], [142, -6], [138, 5], [-138, 5]];
  pencil(c, top, HD.bounds(top), {seed: 2601, color: "#9d978c", len: 12, w: 1.4, density: .12, alpha: () => .45});
  zpen(c, top, {closed: true, w: 1.4, seed: 2602, jit: .4});
  zpen(c, [[-112, -31], [112, -31], [128, -10], [-128, -10]], {closed: true, w: .8, alpha: .5, seed: 2603, jit: .3});
  shade(c, lip, () => .7, {seed: 261});
  zpen(c, lip, {closed: true, w: 1.4, seed: 2604, jit: .4});
  drawLoaf(c, -2, -16, 1, true, 2700);
  const r = rng(2610); c.fillStyle = "#6b4430";
  for (let i = 0; i < 14; i++) { c.beginPath(); c.arc(-110 + r() * 220, -26 + r() * 16, (.6 + r()) * Z, 0, 7); c.fill(); }
}
// 冒的烟：三缕弯线，越往上越断；三帧只换线的种子
function drawSmoke(c, v) {
  const gray = css("--mute");
  [-46, 4, 50].forEach((x0, i) => { const n = noise1(2800 + i * 7 + v * 31), pts = [];
    for (let t = 0; t <= 1; t += .04) pts.push([x0 + Math.sin(t * 7 + i) * 9 + (n(t * 6) - .5) * 6, -44 - t * 110]);
    for (let k = 0; k < pts.length - 2; k += 5) zpen(c, pts.slice(k, k + 4), {w: 1.6 * (1 - k / pts.length * .6), alpha: .95 - k / pts.length * .5, color: gray, seed: 2850 + i * 10 + k + v * 100, jit: .4}); });
}
// 挂杆：一根杆两个托架，挂着打蛋器、刮刀、汤勺（只在留白处画，不压标题）
function drawRail(c, x0, x1, y) {
  zpen(c, [[x0, y], [x1, y]], {w: 2.4, seed: 2900, jit: .3});
  [x0 + 10, x1 - 10].forEach((x, i) => zpen(c, [[x, y - 12], [x, y + 4], [x - 8, y + 4]], {w: 1.6, seed: 2901 + i, jit: .2}));
  const L = x1 - x0, hook = (hx, seed) => zpen(c, [[hx, y], [hx + 5, y + 6], [hx, y + 14], [hx - 4, y + 10]], {w: 1.1, seed, jit: .2});
  // 打蛋器
  let hx = x0 + L * .2; hook(hx, 2910);
  zpen(c, HD.rbox(hx - 5, y + 14, 10, 70, 4), {closed: true, w: 1.3, seed: 2911, jit: .3});
  for (let k = -2; k <= 2; k++) { const pts = []; for (let t = 0; t <= 1; t += .05) pts.push([hx + Math.sin(t * Math.PI) * k * 9, y + 84 + t * 92 + Math.sin(t * Math.PI) * 6]); zpen(c, pts, {w: .9, seed: 2915 + k, jit: .2}); }
  // 刮刀
  hx = x0 + L * .5; hook(hx, 2920);
  const blade = [[hx - 22, y + 104], [hx + 22, y + 104], [hx + 24, y + 160], [hx - 24, y + 160]];
  pencil(c, blade, HD.bounds(blade), {seed: 2921, color: css("--c1"), len: 10, w: 1.4, density: .4, alpha: () => .75});
  shade(c, blade, x => .2 + .6 * (x - hx + 22) / 46, {seed: 292, angle: Math.PI / 2});
  zpen(c, blade, {closed: true, w: 1.3, seed: 2922, jit: .3});
  zpen(c, HD.rbox(hx - 4, y + 14, 8, 92, 3), {closed: true, w: 1.3, seed: 2923, jit: .3});
  for (let k = -1; k <= 1; k++) zpen(c, [[hx + k * 11, y + 118], [hx + k * 11, y + 146]], {w: 1, seed: 2925 + k, jit: .2});
  // 汤勺
  hx = x0 + L * .8; hook(hx, 2930);
  zpen(c, HD.rbox(hx - 4, y + 14, 8, 100, 3), {closed: true, w: 1.3, seed: 2931, jit: .3});
  const bowl = halfEllipse(hx, y + 114, 30, -28, 24);
  pencil(c, bowl, HD.bounds(bowl), {seed: 2932, color: "#a39d92", len: 8, w: 1.3, density: .4, alpha: () => .6});
  shade(c, bowl, (x, yy) => .2 + .6 * (yy - y - 114) / 28 + .2 * (x - hx) / 30, {seed: 293, angle: -.4});
  zpen(c, bowl, {closed: true, w: 1.3, seed: 2933, jit: .3});
}
// 从书上的面包到烤盘里的面包：一道虚线弧，带箭头
function drawArrow(c, P0, P1, P2) {
  const pts = []; for (let t = 0; t <= 1.0001; t += .01) { const m = 1 - t; pts.push([m * m * P0[0] + 2 * m * t * P1[0] + t * t * P2[0], m * m * P0[1] + 2 * m * t * P1[1] + t * t * P2[1]]); }
  for (let i = 0; i < pts.length - 4; i += 6) zpen(c, pts.slice(i, i + 4), {w: 1.5, seed: 3000 + i, jit: .3, alpha: .85});
  const [x2, y2] = pts[pts.length - 1], [x1, y1] = pts[pts.length - 4], a = Math.atan2(y2 - y1, x2 - x1);
  [a + 2.6, a - 2.6].forEach((b, k) => zpen(c, [[x2 + Math.cos(b) * 14, y2 + Math.sin(b) * 14], [x2, y2]], {w: 1.6, seed: 3100 + k, jit: .2}));
}
function drawScene() {
  const sec = document.getElementById("p1"), g = sceneGeo(mq.matches), W = sec.clientWidth, H = sec.clientHeight;
  const k = W / g.LW, LH = H / k, ty = LH - g.up, s = g.s, yb = ty + 26;
  const full = cv => { const c = fitTo(cv, sec); c.scale(k, k); return c; };
  const base = document.getElementById("sc-base"); Object.assign(base.style, {left: 0, top: 0, width: W + "px", height: H + "px"});
  let c = full(base);
  if (g.rail) drawRail(c, ...g.rail);
  drawTable(c, g, ty, LH);
  if (g.sack) at(c, g.sack, yb, s, () => drawSack(c));
  if (g.wheat) at(c, g.wheat, yb, s, () => { drawWheat(c, 0, 0, -1.25, 150, 2460); drawWheat(c, 14, 0, -1.4, 130, 2470); drawWheat(c, 26, 2, -1.05, 120, 2480); });
  at(c, g.tray, yb, s, () => drawTray(c));
  at(c, g.pin[0], ty + g.pin[1], s, () => { c.rotate(g.pin[3]); drawPin(c, g.pin[2]); });
  paperize(base);
  // 配方书单独一块画布：悬停时抬起
  const bx = g.book, bw = 400 * s, bh = 220 * s, book = document.getElementById("sc-book");
  const bc = placeIn(book, k, bx - bw / 2, yb - 170 * s, bw, bh); at(bc, bx, yb, s, () => drawBook(bc)); paperize(book, .4);
  Object.assign(document.getElementById("sc-hit").style, {left: (bx - 180 * s) * k + "px", top: (yb - 155 * s) * k + "px", width: 360 * s * k + "px", height: 165 * s * k + "px"});
  c = full(document.getElementById("sc-arrow"));
  const A0 = [bx + 110 * s, yb - 125 * s], A2 = [g.tray - 60 * s, yb - 62 * s], A1 = [(A0[0] + A2[0]) / 2, Math.min(A0[1], A2[1]) - g.arc * s * 1.6];
  drawArrow(c, A0, A1, A2);
  document.querySelectorAll(".sc-smoke").forEach((cv, v) => { const sc = full(cv); at(sc, g.tray, yb, s, () => drawSmoke(sc, v)); paperize(cv, .3); });
  // 三处标注：书上方、弧线顶上、烟的上方
  const top = (A0[1] + 2 * A1[1] + A2[1]) / 4;
  [["sl-a", bx, yb - 182 * s], ["sl-b", (A0[0] + 2 * A1[0] + A2[0]) / 4, top - 22 / k], ["sl-c", g.tray, yb - 182 * s]].forEach(([id, x, y]) =>
    Object.assign(document.getElementById(id).style, {left: x * k + "px", top: y * k + "px", fontSize: g.ls + "px"}));
}
function drawP1() {
  if (!document.getElementById("p1").offsetParent) return; // 截图时可能隐藏了第一屏
  drawScene();
  const sec = document.getElementById("p1"), S = sec.getBoundingClientRect(), H = sec.querySelector(".head").getBoundingClientRect();
  const rel = el => { const r = el.getBoundingClientRect(); return {x: r.left - S.left, y: r.top - S.top, w: r.width, h: r.height}; };
  const relH = el => { const r = el.getBoundingClientRect(); return {x: r.left - H.left, y: r.top - H.top, w: r.width, h: r.height}; };
  const cv = document.getElementById("c1"), c = fitTo(cv, sec); // 整屏画布：花边、页眉胶带、翻页键
  HD.frame(c, sec.clientWidth, sec.clientHeight, mq.matches ? 6 : 20, 1400);
  HD.tagTape(c, rel(sec.querySelector(".tag")), 1410);
  const key = document.getElementById("key");
  if (key) {
    const K = rel(key);
    pen(c, rbox(K.x, K.y - 3, K.w, K.h + 5, 6), {closed: true, w: 1.2, seed: 920, jit: .5, color: css("--mute")});
    pen(c, [[K.x + 4, K.y + K.h + 4.5], [K.x + K.w - 4, K.y + K.h + 4]], {w: 1.6, seed: 921, jit: .4, color: css("--mute"), alpha: .8});
  }
  paperize(cv);
  // 标题下的标记挂在 .head 里，按标题坐标画（整屏坐标会在视口高度变化时错位）
  const fs = parseFloat(getComputedStyle(sec.querySelector(".q")).fontSize), lw = Math.max(1.4, fs / 34);
  const A = relH(document.getElementById("mk-a")), ca = document.getElementById("ul-a"); // 看得懂：一抹彩铅加两道肯定的钢笔线
  let u = place(ca, A.x - 20, A.y + A.h * .3, A.w + 44, A.h * .7 + lw * 10);
  pencil(u, null, [A.x - 4, A.y + A.h * .5, A.x + A.w + 4, A.y + A.h * .92], {seed: 900, color: css("--c0"), len: fs * .3, w: lw * 1.1, density: .045, tooth: .45, alpha: () => .9});
  const yA = A.y + A.h * .94;
  pen(u, [[A.x - 4, yA], [A.x + A.w * .5, yA + 1.5], [A.x + A.w + 10, yA - 1]], {w: lw * 1.3, seed: 901, jit: .6});
  pen(u, [[A.x + 6, yA + lw * 4.5], [A.x + A.w + 2, yA + lw * 4]], {w: lw * 1.1, seed: 902, jit: .6});
  paperize(ca);
  const B = relH(document.getElementById("mk-b")), cb = document.getElementById("ul-b"); // 做不好：同样起笔，越往后越断、越淡
  u = place(cb, B.x - 10, B.y + B.h * .78, B.w + 34, B.h * .22 + 14);
  const yB = B.y + B.h * .94, r = rng(903);
  let t = 0, seg = 0;
  while (t < B.w + 14) {
    const Lb = B.w + 14, f = t / Lb, len = (1 - f) * 34 + 4 + r() * 6, gap = f * f * 26 + r() * 3, x1 = B.x - 4 + t, x2 = Math.min(B.x - 4 + Lb, x1 + len);
    pen(u, [[x1, yB + (r() - .5) * 1.5], [x2, yB + (r() - .5) * 1.5 + f * 2]], {w: lw * 1.3 * (1 - f * .5), alpha: 1 - f * .7, seed: 910 + seg++, jit: .5});
    t += len + gap;
  }
  paperize(cb);
}

// ---------- 翻页：第一屏 → 第二屏逐层 ----------
const SEQ = [{s:"p1"}, {s:"p2", j:0}, {s:"p2", j:1}, {s:"p2", j:2}, {s:"p2", j:3}];
let pos = 0;
function go(i) {
  pos = Math.max(0, Math.min(SEQ.length - 1, i)); const it = SEQ[pos];
  document.getElementById(it.s).scrollIntoView({behavior: reduce ? "auto" : "smooth"});
  if (it.j !== undefined) show(it.j);
}
addEventListener("keydown", e => {
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(pos + 1); }
  if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(pos - 1); }
});
if (matchMedia("(pointer:coarse)").matches) document.querySelector(".hint").textContent = "往下滑 ↓"; // 触屏没有方向键

// 手写排字：标题、条目名、页眉、场景里的标注
handsetAll();
function handsetAll() {
  HD.handset(document.querySelector(".s1 .q"), 61);
  HD.handset(document.querySelector(".s2 h2"), 62);
  document.querySelectorAll(".kicker").forEach((el, i) => HD.handset(el, 63 + i, .6));
  list.querySelectorAll(".name").forEach((el, i) => HD.handset(el, 70 + i));
  document.querySelectorAll(".sl").forEach((el, i) => HD.handset(el, 80 + i));
}

const qs = new URLSearchParams(location.search);
if (qs.has("row")) cur = +qs.get("row");
if (qs.get("only") === "2") document.getElementById("p1").style.display = "none";
let t0;
function all() { render(); drawList(); drawP2(); drawP1(); }
addEventListener("resize", () => { clearTimeout(t0); t0 = setTimeout(all, 160); });
mq.addEventListener("change", all);
// 纸先生成，字体显式加载完再画（canvas 的 fillText 也要等网页字体）
Promise.all([HD.init(), HD.fontsReady([["HD Marker", "配方看得懂"], ["HD Hand", "面包"]])]).then(() => {
  all();
  // 标题换行或整屏高度变了（手机地址栏收起、无头截图视口变化）都重画装饰
  let t1; const ro = new ResizeObserver(() => { clearTimeout(t1); t1 = setTimeout(() => { drawP1(); drawList(); drawP2(); }, 60); });
  [".s1 .q", "#p1", "#p2"].forEach(q => ro.observe(document.querySelector(q)));
  const p1 = document.getElementById("p1"); // 首屏入场：场景从左往右画出 → 书落下 → 下划线 → 箭头画过去 → 烟冒出来
  if (reduce) p1.classList.add("go"); else requestAnimationFrame(() => requestAnimationFrame(() => p1.classList.add("go")));
  const p2 = document.getElementById("p2"); // 第二屏第一次进入视野时，当前这层重新画一遍
  if (!reduce) new IntersectionObserver((es, io) => {
    if (!es[0].isIntersecting) return; io.disconnect();
    p2.classList.add("reset"); overlays.forEach(cv => cv.classList.remove("on")); list.querySelectorAll("li").forEach(li => li.classList.remove("on"));
    p2.getBoundingClientRect(); p2.classList.remove("reset"); requestAnimationFrame(() => show(cur));
  }, {threshold: .35}).observe(p2);
  if (qs.get("p") === "2") { p2.scrollIntoView(); pos = 1 + cur; }
  document.documentElement.dataset.ready = "1";
});
</script>
